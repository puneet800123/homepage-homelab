apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-homelab-config
  namespace: default
  labels:
    app: homepage-homelab
data:
  # Mounted at /config/application.yml and picked up by Spring Boot via
  # SPRING_CONFIG_ADDITIONAL_LOCATION, overriding the packaged defaults.
  # Non-secret settings only — API keys come from the Secret (env vars).
  application.yml: |
    profile:
      name: "Puneet Singh"
      title: "Senior DevOps & SRE Engineer"
      summary: >-
        DevOps Lead with 7+ years in large-scale telecom environments, specialising in
        monitoring/observability platforms, CI/CD automation, Kubernetes-based
        infrastructure, and AI-driven workflow integrations. Proven track record leading
        engineering teams, driving DevOps culture, and delivering high-availability
        platforms through IaC, containerisation, and continuous improvement.
      links:
        linkedin: "https://www.linkedin.com/in/puneet800123"
        github: "https://github.com/puneet800123"
        resume: "https://files.puneet800123.com/api/public/dl/P9ugp2xC?inline=true"
        coverLetter: "https://files.puneet800123.com/api/public/dl/hWIANdBo?inline=true"
      certifications:
        - name: "Certified Kubernetes Administrator (CKA)"
          issuer: "The Linux Foundation"
          year: "Feb 2026"
          verifyUrl: "https://lnkd.in/ekSxsznh"
        - name: "Claude Code in Action"
          issuer: "Anthropic Education"
          year: "Jul 2026"
          verifyUrl: "https://verify.skilljar.com/c/cedighb2sxia"
        - name: "Introduction to Model Context Protocol"
          issuer: "Anthropic Education"
          year: "Jul 2026"
          verifyUrl: "https://verify.skilljar.com/c/26jjjpj3f5x7"
        - name: "Model Context Protocol: Advanced Topics"
          issuer: "Anthropic Education"
          year: "Jul 2026"
          verifyUrl: "https://verify.skilljar.com/c/zk9e72nie2h5"

    prometheus:
      url: "http://prometheus:9090"
      queries:
        cpuTempCelsius: 'node_hwmon_temp_celsius{chip="platform_coretemp_0",sensor="temp1"}'
      disks:
        - label: "SSD (root, NVMe)"
          mountpoint: "/"
          tempChip: "nvme_nvme0"
        - label: "HDD 1 (Frigate)"
          mountpoint: "/mntfrigate"
        - label: "HDD 2 (media/apps)"
          mountpoint: "/mnt"

    system:
      system: "Dell Precision Tower 3420"
      os: "Debian GNU/Linux 12 (bookworm)"
      kubernetes: "K3s v1.36.3+k3s1"
      cpu:
        model: "Intel Xeon E3-1245 v5"
        cores: 8
        baseClock: "3.50 GHz"
      memory:
        total: "24 GB"
        type: "DDR4"
        speed: "3200 MT/s (rated)"
        configuredSpeed: "2133 MT/s"
      disks:
        - label: "SSD (root)"
          model: "ADATA XPG GAMMIX S70 BLADE"
          capacity: "512 GB"
          type: "NVMe SSD"
          mountpoint: "/"
        - label: "HDD 1 (Frigate)"
          model: "Seagate ST1000LM024"
          capacity: "1 TB"
          type: "HDD 5400rpm"
          mountpoint: "/mntfrigate"
        - label: "HDD 2 (media/apps)"
          model: "Seagate ST1000DM003"
          capacity: "1 TB"
          type: "HDD 7200rpm"
          mountpoint: "/mnt"

    apps:
      services:
        # ---------------- Media ----------------
        - name: sonarr
          type: sonarr
          category: Media
          baseUrl: "http://sonarr"
          apiKey: "${SONARR_API_KEY:CHANGE_ME}"
          enabled: true
          serviceName: sonarr
        - name: radarr
          type: radarr
          category: Media
          baseUrl: "http://radarr"
          apiKey: "${RADARR_API_KEY:CHANGE_ME}"
          enabled: true
          serviceName: radarr
        - name: prowlarr
          type: prowlarr
          category: Media
          baseUrl: "http://prowlarr"
          apiKey: "${PROWLARR_API_KEY:CHANGE_ME}"
          enabled: true
          serviceName: prowlarr
        - name: lidarr
          type: generic
          category: Media
          baseUrl: "http://lidarr"
          enabled: true
          serviceName: lidarr
        - name: bazarr
          type: generic
          category: Media
          baseUrl: "http://bazarr/bazarr"
          enabled: true
          serviceName: bazarr
        - name: jellyfin
          type: generic
          category: Media
          baseUrl: "http://jellyfin"
          enabled: true
          serviceName: jellyfin
        - name: jellyseerr
          type: generic
          category: Media
          baseUrl: "http://jellyseerr"
          enabled: true
          serviceName: jellyseerr
        - name: immich
          type: immich
          category: Media
          baseUrl: "http://immich-server:2283"
          apiKey: "${IMMICH_API_KEY:CHANGE_ME}"
          enabled: true
          serviceName: immich-server
        - name: qbittorrent
          type: qbittorrent
          category: Media
          baseUrl: "http://qbittorrent:8080"
          apiKey: ""
          enabled: true
          nodePort: 31579   # multi-port svc; pin web UI
        - name: flaresolverr
          type: generic
          category: Media
          baseUrl: "http://flaresolverr"
          enabled: true
          serviceName: flaresolverr

        # ---------------- Observability ----------------
        - name: grafana
          type: generic
          category: Observability
          baseUrl: "http://grafana"
          enabled: true
          serviceName: grafana
        - name: prometheus
          type: generic
          category: Observability
          baseUrl: "http://prometheus:9090"
          enabled: true
          serviceName: prometheus
        - name: victorialogs
          type: generic
          category: Observability
          baseUrl: "http://victorialogs:9428"
          enabled: true
          serviceName: victorialogs
        - name: radar
          type: generic
          category: Observability
          baseUrl: "http://radar-svc:9280"
          enabled: true
          serviceName: radar-svc

        # ---------------- Smart Home ----------------
        - name: home-assistant
          type: tcp
          category: Smart Home
          baseUrl: "http://192.168.0.199:8123"
          enabled: true
          serviceName: homeassistant
        - name: frigate
          type: generic
          category: Smart Home
          baseUrl: "http://frigate"
          enabled: true
          nodePort: 31052   # multi-port svc; pin web UI
        - name: go2rtc
          type: tcp
          category: Smart Home
          baseUrl: "http://192.168.0.199:31060"
          enabled: true
          # no dedicated web UI to link
        - name: mqtt
          type: tcp
          category: Smart Home
          baseUrl: "http://mqtt:1883"
          enabled: true
          # broker, no web UI to link

        # ---------------- Apps & Tools ----------------
        - name: n8n
          type: generic
          category: Apps & Tools
          baseUrl: "http://n8n-svc"
          enabled: true
          serviceName: n8n-svc
        - name: code-server
          type: generic
          category: Apps & Tools
          baseUrl: "http://code-server"
          enabled: true
          serviceName: code-server
        - name: cloudbeaver
          type: generic
          category: Apps & Tools
          baseUrl: "http://cloudbeaver:8978"
          enabled: true
          serviceName: cloudbeaver
        - name: guacamole
          type: generic
          category: Apps & Tools
          baseUrl: "http://guacamole"
          enabled: true
          serviceName: guacamole
        - name: vaultwarden
          type: generic
          category: Apps & Tools
          baseUrl: "http://vault"
          enabled: true
          serviceName: vault
        - name: fileserver
          type: generic
          category: Apps & Tools
          baseUrl: "http://fileserver"
          enabled: true
          serviceName: fileserver
        - name: openspeedtest
          type: generic
          category: Apps & Tools
          baseUrl: "http://openspeedtest:3000"
          enabled: true
          serviceName: openspeedtest
        - name: portainer
          type: generic
          category: Apps & Tools
          baseUrl: "https://portainer:9443"
          enabled: true
          nodePort: 30492   # multi-port svc; pin HTTPS UI

        # ---------------- Databases & Infra (health only) ----------------
        - name: postgres
          type: tcp
          category: Databases & Infra
          baseUrl: "http://postgres:5432"
          enabled: true
          # DB, no web UI
        - name: immich-postgres
          type: tcp
          category: Databases & Infra
          baseUrl: "http://immich-postgres:5432"
          enabled: true
        - name: immich-redis
          type: tcp
          category: Databases & Infra
          baseUrl: "http://immich-redis:6379"
          enabled: true
        - name: immich-ml
          type: generic
          category: Databases & Infra
          baseUrl: "http://immich-machine-learning:3003"
          enabled: true
        - name: minio
          type: generic
          category: Databases & Infra
          baseUrl: "http://minio:9000"
          enabled: true
          nodePort: 30879   # console UI (2nd port)
