apiVersion: v1
kind: Service
metadata:
  name: homepage-homelab
  namespace: default
  labels:
    app: homepage-homelab
spec:
  type: NodePort
  selector:
    app: homepage-homelab
  ports:
    - name: http
      port: 80
      targetPort: 8080
      # nodePort auto-assigned; pin one here if you want a stable port.
