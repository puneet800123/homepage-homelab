apiVersion: v1
kind: Secret
metadata:
  name: homepage-homelab-secret
  namespace: default
  labels:
    app: homepage-homelab
type: Opaque
stringData:
  # CHANGE_ME: API keys/tokens for the self-hosted apps you want live on the
  # dashboard. Leave as CHANGE_ME to keep an app in the "Not configured" state.
  # After filling these in, also set the matching app's enabled: true in the
  # ConfigMap (or here via a SPRING_APPLICATION_JSON override).
  SONARR_API_KEY: CHANGE_ME
  RADARR_API_KEY: CHANGE_ME
  PROWLARR_API_KEY: CHANGE_ME
  QBITTORRENT_API_KEY: CHANGE_ME
