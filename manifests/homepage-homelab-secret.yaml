apiVersion: v1
kind: Secret
metadata:
  name: homepage-homelab-secret
  namespace: default
  labels:
    app: homepage-homelab
type: Opaque
stringData:
  # CHANGE_ME: API keys/tokens for the self-hosted apps you want live on the
  # dashboard. Real values are applied directly to the cluster Secret and are
  # intentionally NOT committed here. qBittorrent needs no key in this setup.
  SONARR_API_KEY: CHANGE_ME
  RADARR_API_KEY: CHANGE_ME
  PROWLARR_API_KEY: CHANGE_ME
  IMMICH_API_KEY: CHANGE_ME
